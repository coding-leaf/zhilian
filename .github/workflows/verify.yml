# 智练工程门禁流水线
#
# 命令**精确镜像** Taskfile.yml 的 verify-backend / verify-frontend，
# 不另立一套门禁 —— 本地跑绿即 CI 跑绿，避免两边标准漂移。
#
# 无需外部服务：项目的外部能力（大模型 / OCR / 向量化 / 存储 / 队列）全部有纯内存假实现，
# 所以这里不挂 postgres / redis service 容器，测试也不依赖网络。
#
# 覆盖率留档与静态扫描（中期质量检查新增）：
#   - backend / frontend 两个 job 各自上传覆盖率报告 artifact（保留 14 天）；
#   - sonar job 依赖前两者，消费报告做 SonarCloud 扫描；
#   - **未配置 SONAR_TOKEN 时 sonar job 短路并保持绿色**，不影响现有门禁绿度。

name: verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支的重复推送取消上一次运行，省 runner 也省等待
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端门禁（ruff / mypy / import-linter / 安全扫描 / pytest / 分模块覆盖率 / diff-cover）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # fetch-depth: 0 是必需的 —— diff-cover 要拿 origin/master 算 merge-base，
      # 默认的浅克隆里没有这个 ref，增量门禁会退化成空 diff（静默放行）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 固定 Python 3.13
        run: uv python install 3.13

      - name: 安装依赖（锁文件冻结）
        run: uv sync --frozen --extra dev

      - name: ruff 格式检查
        run: uv run ruff format --check .

      - name: ruff 静态检查
        run: uv run ruff check .

      - name: mypy 严格类型检查
        run: uv run mypy app

      - name: import-linter 架构契约
        run: uv run lint-imports

      # 安全扫描（《代码管理工作介绍 V1.0》表 4-2）：高危及以上为 0（阻断合并）；
      # 中危仅登记不阻断，全量报告随 artifact 留档（当前 2 项已评估，见中期质量检查报告）。
      - name: bandit 安全扫描（高危及以上阻断）
        run: uv run bandit -r app -lll -q

      - name: bandit 全量报告留档（中危登记，不阻断）
        if: always()
        run: uv run bandit -r app -ll -q -f txt -o bandit-report.txt --exit-zero

      # 依赖漏洞：发现任何已知漏洞即阻断（当前 0 项，pyjwt 已升至 2.15.1）。
      - name: pip-audit 依赖漏洞扫描
        run: uv run pip-audit

      # 与 Taskfile.yml 的 verify-backend 逐字一致：门禁语义（--cov-fail-under=80）不变，
      # 额外落 coverage.xml 供 artifact 与 SonarCloud 消费、coverage.json 供分模块阈值校验。
      - name: pytest（覆盖率 ≥ 80%）
        run: uv run pytest tests --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json --cov-fail-under=80

      # 分模块覆盖率阈值（《代码管理工作介绍 V1.0》§4.3）：
      # 全局 行≥80%/分支≥70%；algorithms 行≥95%/分支≥90%；security 行≥95%；services 行≥85%。
      # 阈值唯一事实源在 tooling/check_coverage.py（与文档同步维护）。
      - name: 分模块覆盖率阈值（tooling/check_coverage.py）
        run: uv run python ../tooling/check_coverage.py --report coverage.json

      # 与 Taskfile.yml 的 verify-backend 逐字一致：增量覆盖率与全量口径**叠加**，
      # 全量防倒退、增量防「新代码没测」。无匹配改动时 diff-cover 退出码为 0（已实测）。
      # ⚠️ 不要给 diff-cover 加 --include：实测在本项目布局下永不匹配，
      #    会输出 "No lines with coverage information" 并 exit 0（静默放行）。
      - name: 增量覆盖率 · 改动行（≥ 80%）
        run: uv run diff-cover coverage.xml --compare-branch=origin/master --fail-under=80

      - name: T0 核心模块覆盖率（≥ 90%）
        run: uv run coverage report --include="app/core/algorithms/*,app/core/security.py,app/core/errors.py" --fail-under=90

      - name: T0 接口依赖层覆盖率（当前 ≥ 80%，目标 90%）
        run: uv run coverage report --include="app/api/deps/*" --fail-under=80

      - name: 上传后端覆盖率与安全扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage.json
            backend/bandit-report.txt
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: 前端门禁（eslint / vue-tsc / vitest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: miniprogram/pnpm-lock.yaml

      - name: 安装依赖（锁文件冻结）
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm run lint

      - name: vue-tsc 类型检查
        run: pnpm run type-check

      # 与 Taskfile.yml 的 verify-frontend 一致：用 test:cov 一次跑完测试与覆盖率；
      # 覆盖率**只统计不设阈值**，因此门禁语义不变。
      - name: vitest 单元测试（含覆盖率）
        run: pnpm run test:cov

      - name: 上传前端覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: miniprogram/coverage/
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: 静态扫描（SonarCloud）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # 未配置该 secret 时本 job 短路为绿色，避免「未启用」被误读成「代码有问题」。
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: 未配置 SONAR_TOKEN，跳过静态扫描
        if: env.SONAR_TOKEN == ''
        run: echo "::notice title=SonarCloud 未启用::未配置 SONAR_TOKEN secret，已跳过静态扫描。配置方法见 中期质量检查/环境与CI准备.md。"

      # fetch-depth: 0 是必需的 —— SonarCloud 需要完整历史来判定「新代码」，
      # 浅克隆会让新增代码覆盖率失真。
      - name: 检出（完整历史）
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载覆盖率报告
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 版本固定 v8：v6.0.0 修复了 args 命令注入漏洞（CVE-2025-59844），
      # 不要降级到 v5 及以下。最新为 v8.2.2（2026-09-17）。
      - name: SonarCloud 扫描
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
