# 智练工程门禁流水线
#
# 命令**精确镜像** Taskfile.yml 的 verify-backend / verify-frontend，
# 不另立一套门禁 —— 本地跑绿即 CI 跑绿，避免两边标准漂移。
#
# 无需外部服务：项目的外部能力（大模型 / OCR / 向量化 / 存储 / 队列）全部有纯内存假实现，
# 所以这里不挂 postgres / redis service 容器，测试也不依赖网络。
#
# 覆盖率留档与静态扫描（中期质量检查新增）：
#   - backend / frontend 两个 job 各自上传覆盖率报告 artifact（保留 14 天）；
#   - sonar job 依赖前两者，消费报告做 SonarCloud 扫描；
#   - **未配置 SONAR_TOKEN 时 sonar job 短路并保持绿色**，不影响现有门禁绿度。

name: verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支的重复推送取消上一次运行，省 runner 也省等待
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端门禁（ruff / mypy / import-linter / pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 固定 Python 3.13
        run: uv python install 3.13

      - name: 安装依赖（锁文件冻结）
        run: uv sync --frozen --extra dev

      - name: ruff 格式检查
        run: uv run ruff format --check .

      - name: ruff 静态检查
        run: uv run ruff check .

      - name: mypy 严格类型检查
        run: uv run mypy app

      - name: import-linter 架构契约
        run: uv run lint-imports

      # 与 Taskfile.yml 的 verify-backend 逐字一致：门禁语义（--cov-fail-under=80）不变，
      # 只是额外落一份 coverage.xml 供 artifact 与 SonarCloud 消费。
      - name: pytest（覆盖率 ≥ 80%）
        run: uv run pytest tests --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: 上传后端覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: 前端门禁（eslint / vue-tsc / vitest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: miniprogram/pnpm-lock.yaml

      - name: 安装依赖（锁文件冻结）
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm run lint

      - name: vue-tsc 类型检查
        run: pnpm run type-check

      # 与 Taskfile.yml 的 verify-frontend 一致：用 test:cov 一次跑完测试与覆盖率；
      # 覆盖率**只统计不设阈值**，因此门禁语义不变。
      - name: vitest 单元测试（含覆盖率）
        run: pnpm run test:cov

      - name: 上传前端覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: miniprogram/coverage/
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: 静态扫描（SonarCloud）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # 未配置该 secret 时本 job 短路为绿色，避免「未启用」被误读成「代码有问题」。
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: 未配置 SONAR_TOKEN，跳过静态扫描
        if: env.SONAR_TOKEN == ''
        run: echo "::notice title=SonarCloud 未启用::未配置 SONAR_TOKEN secret，已跳过静态扫描。配置方法见 中期质量检查/环境与CI准备.md。"

      # fetch-depth: 0 是必需的 —— SonarCloud 需要完整历史来判定「新代码」，
      # 浅克隆会让新增代码覆盖率失真。
      - name: 检出（完整历史）
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载覆盖率报告
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 版本固定 v8：v6.0.0 修复了 args 命令注入漏洞（CVE-2025-59844），
      # 不要降级到 v5 及以下。最新为 v8.2.2（2026-09-17）。
      - name: SonarCloud 扫描
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
