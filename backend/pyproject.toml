[project]
name = "zhilian-backend"
version = "0.1.0"
description = "ZhiLian AI Autonomous Learning Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "cryptography>=43.0.0",
    "pgvector>=0.3.0",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.4",
    "python-multipart>=0.0.32",
    "redis>=5.0.0",
    "rq>=2.0,<3.0",
    "boto3>=1.34.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "httpx>=0.27.0",
    "diff-cover>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S", "RUF", "ASYNC", "C901"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 28

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

# ============================================================================
# 覆盖率配置（《代码管理工作介绍 V1.0》§4.3）
# ----------------------------------------------------------------------------
# 统计范围：仅 backend/app（测试代码与工程脚本不计入）；分支统计必开。
# 分模块阈值由 tooling/check_coverage.py 读取 coverage.json 校验：
#   全局 行≥80% / 分支≥70%；algorithms 行≥95% / 分支≥90%；
#   security.py 行≥95%；services 行≥85%。
# 排除清单（四类，2026-10-05 落地；新增排除项须走合并请求，写明行数/理由/替代验证）：
#   1) app/main.py              应用启动装配（54 行/8 分支）——启动路径由
#      test_app_lifespan.py 以装配断言 + e2e 冒烟替代验证
#   2) app/worker.py            任务消费进程入口（76 行/20 分支）——进程生命周期由
#      deploy 健康检查 + test_p0_full_chain_e2e.py 替代验证
#   3) migrations/env.py        迁移脚本环境装配（source=app 外，显式声明防 source 调整）
#      ——升级/降级路径由 test_migration_model_consistency.py 替代验证
#   4) app/schemas/*            Pydantic 模式定义目录（1273 行/362 分支）——声明式模型，
#      结构契约由 schemas 单测 + OpenAPI 快照替代验证
# 禁止用行内标注（# pragma: no cover）规避阈值。
# ============================================================================
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/main.py",
    "app/worker.py",
    "migrations/env.py",
    "app/schemas/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "五层单向架构依赖契约"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.repositories",
]

[[tool.importlinter.contracts]]
name = "仓储层禁止外部框架与业务层"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = [
    "fastapi",
    "app.integrations",
    "app.services",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "纯函数算法计算核隔离"
type = "forbidden"
source_modules = ["app.core.algorithms"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "httpx",
    "redis",
    "boto3",
    "app.api",
    "app.services",
    "app.repositories",
]

[[tool.importlinter.contracts]]
name = "适配层禁止依赖业务服务与路由"
type = "forbidden"
source_modules = ["app.integrations"]
forbidden_modules = [
    "app.services",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "核心基础模块禁止反向依赖上层业务"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.integrations",
]



[dependency-groups]
dev = [
    "import-linter>=2.15",
]
