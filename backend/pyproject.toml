[project]
name = "zhilian-backend"
version = "0.1.0"
description = "ZhiLian AI Autonomous Learning Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "cryptography>=43.0.0",
    "pgvector>=0.3.0",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.4",
    "python-multipart>=0.0.32",
    "redis>=5.0.0",
    "rq>=2.0,<3.0",
    "boto3>=1.34.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "httpx>=0.27.0",
    "diff-cover>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S", "RUF", "ASYNC", "C901"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 28

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "五层单向架构依赖契约"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.repositories",
]

[[tool.importlinter.contracts]]
name = "仓储层禁止外部框架与业务层"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = [
    "fastapi",
    "app.integrations",
    "app.services",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "纯函数算法计算核隔离"
type = "forbidden"
source_modules = ["app.core.algorithms"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "httpx",
    "redis",
    "boto3",
    "app.api",
    "app.services",
    "app.repositories",
]

[[tool.importlinter.contracts]]
name = "适配层禁止依赖业务服务与路由"
type = "forbidden"
source_modules = ["app.integrations"]
forbidden_modules = [
    "app.services",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "核心基础模块禁止反向依赖上层业务"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.integrations",
]



[dependency-groups]
dev = [
    "import-linter>=2.15",
]
