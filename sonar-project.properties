# SonarCloud 扫描配置（智练自主学习平台）
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │ 使用前必须回填下面两个占位符，否则扫描会失败：                       │
# │   1. 用 GitHub 账号登录 https://sonarcloud.io                       │
# │   2. 导入仓库 coding-leaf/zhilian，记下 Organization Key 与 Project Key │
# │   3. 把 ORGANIZATION-KEY / PROJECT-KEY 两处替换为真实值              │
# │   4. SonarCloud 生成 token → 存入 GitHub 仓库 secret `SONAR_TOKEN`   │
# │ 详细步骤见：中期质量检查/环境与CI准备.md §SonarCloud 接入手册         │
# └─────────────────────────────────────────────────────────────────────┘
#
# 未回填 / 未配置 token 时：CI 的 sonar job 会短路并保持绿色，不影响门禁。

sonar.host.url=https://sonarcloud.io
sonar.organization=ORGANIZATION-KEY
sonar.projectKey=PROJECT-KEY
sonar.projectName=zhilian

sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# 源码与测试根目录
sonar.sources=backend/app,miniprogram/src
sonar.tests=backend/tests,miniprogram/tests

# 覆盖率报告：由 .github/workflows/verify.yml 的 backend / frontend job 产出后上传为 artifact
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=miniprogram/coverage/lcov.info

# 排除：数据库迁移脚本为自动生成，类型声明文件不含可执行逻辑。
# （若某属性不被识别，SonarScanner 只会告警，不会导致扫描失败。）
sonar.exclusions=backend/migrations/**,**/*.d.ts
# SonarJS 默认后缀不含 .vue，显式补上以便分析小程序页面与组件。
sonar.javascript.file.suffixes=.js,.jsx,.cjs,.mjs,.ts,.tsx,.vue
