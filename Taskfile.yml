version: '3'

tasks:
  worker:
    desc: Run the Redis/RQ background worker
    dir: backend
    env:
      ZHILIAN_QUEUE__PROVIDER: redis
    cmds:
      - uv run python -m app.worker
  verify-backend:
    desc: Run all backend quality gates (ruff format/check, mypy, import-linter, 安全扫描, pytest coverage, 分模块阈值, diff-cover incremental)
    dir: backend
    env:
      # import-linter 用 rich 写转圈动画；Windows 控制台默认 GBK，遇到 U+2219 会抛
      # UnicodeEncodeError，且发生在任何契约被评估之前 —— 门禁会假失败。
      # 强制 UTF-8 输出即可；Linux/Docker 上此设置无副作用。
      PYTHONIOENCODING: utf-8
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run mypy app
      - uv run lint-imports
      # 安全扫描（《代码管理工作介绍 V1.0》表 4-2）：高危及以上为 0（阻断）；
      # 中危仅登记不阻断，全量报告留档 bandit-report.txt（当前 2 项已评估）。
      # --exit-zero：留档步骤不因已登记的中危改退出码（阻断职责在上一行 -lll）。
      - uv run bandit -r app -lll -q
      - uv run bandit -r app -ll -q -f txt -o bandit-report.txt --exit-zero
      # 依赖漏洞：发现任何已知漏洞即阻断（当前 0 项，pyjwt 已升至 2.15.1）。
      - uv run pip-audit
      # 覆盖率运行：--cov-report=json 供分模块阈值脚本消费（tooling/check_coverage.py）。
      - uv run pytest tests --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json --cov-fail-under=80
      # 分模块覆盖率阈值（《代码管理工作介绍 V1.0》§4.3）：
      # 全局 行≥80%/分支≥70%；algorithms 行≥95%/分支≥90%；security 行≥95%；services 行≥85%。
      # 阈值唯一事实源在 tooling/check_coverage.py（与文档同步维护）。
      - uv run python ../tooling/check_coverage.py --report coverage.json
      # 增量覆盖率：防「新代码没测」。与全量口径**叠加而非替换** ——
      # 全量防倒退（老代码被改坏），增量防漏测（新代码没有测试）。
      # ⚠️ 不要给 diff-cover 加 --include：实测它在本项目布局下永不匹配，
      #    会输出 "No lines with coverage information" 并 exit 0 =
      #    **静默放行**，比没有门禁更危险。分模块加严请用上面的 check_coverage.py。
      # 无匹配改动时 diff-cover 也返回 0（已实测），故在 master 上空跑不会假红灯。
      - uv run diff-cover coverage.xml --compare-branch=origin/master --fail-under=80
      # T0 核心模块绝对覆盖率 ≥90%（2026-10-03 实测 99%）
      - uv run coverage report --include="app/core/algorithms/*,app/core/security.py,app/core/errors.py" --fail-under=90
      # T0 接口依赖层：实测 84%，暂设 80% 防止继续下滑；目标 90%，
      # 缺口见 中期质量检查/单测计划.md §4（app/api/deps/user.py 有 2 行未覆盖）
      - uv run coverage report --include="app/api/deps/*" --fail-under=80

  verify-frontend:
    desc: Run all frontend quality gates (eslint, vue-tsc typecheck, vitest unit tests with coverage)
    dir: miniprogram
    cmds:
      - pnpm run lint
      - pnpm run type-check
      # 用 test:cov 而非 test:unit：一次运行同时完成「测试 + 覆盖率」，
      # 既保证门禁语义不变（无阈值），又产出 lcov 供 CI 上传与 SonarCloud 消费。
      # 前置条件：已执行过 pnpm install（新增了 @vitest/coverage-v8）。
      - pnpm run test:cov

  verify:
    desc: Execute full-stack physical verification gates (Backend + Frontend)
    cmds:
      - task: verify-backend
      - task: verify-frontend

  test-backend:
    desc: Run fast backend unit tests without coverage overhead
    dir: backend
    cmds:
      - uv run pytest tests

  test-frontend:
    desc: Run fast frontend unit tests
    dir: miniprogram
    cmds:
      - pnpm run test:unit

  format:
    desc: Auto-format backend and frontend source code
    cmds:
      - cmd: cd backend && uv run ruff format . && uv run ruff check --fix .
      - cmd: cd miniprogram && pnpm run lint --fix
